<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { max-width: 820px; margin: 0 auto; padding: 32px 20px 56px; color: #202124; line-height: 1.7; }
      a { color: #0b57d0; }
      h1 { line-height: 1.25; }
      pre { padding: 16px; overflow-x: auto; background: #f6f8fa; border-radius: 6px; }
      code { background: #f6f8fa; padding: 2px 4px; }
      nav { border-bottom: 1px solid #dadce0; margin-bottom: 32px; padding-bottom: 12px; }
    </style>
  </head>
  <body>
    <nav><a href="{{ '/' | relative_url }}">{{ site.title }}</a> | <a href="{{ '/docs/tutorials/' | relative_url }}">Integration tutorials</a></nav>
    <main>{{ content }}</main>
  </body>
</html>
