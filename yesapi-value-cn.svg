<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">YesAPI 超低价示例</title>
  <desc id="desc">支付十元人民币，到账十美元额度，约五十美元可用价值。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1080" height="520" rx="34" fill="url(#bg)"/>
  <rect x="28" y="28" width="1024" height="464" rx="28" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadow)"/>

  <text x="540" y="86" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#111827">YesAPI：一眼看懂，真的很便宜</text>
  <text x="540" y="124" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748b">先低价充值，再按模型低倍率消耗，余额用得更久</text>

  <g transform="translate(70 170)">
    <rect x="0" y="0" width="270" height="220" rx="24" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
    <text x="135" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="64" font-weight="900" fill="#e11d48">¥10</text>
    <text x="135" y="104" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="800" fill="#111827">你支付</text>
    <text x="135" y="145" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">充值门槛低</text>
    <text x="135" y="174" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">小额就能开始用</text>
  </g>

  <g transform="translate(405 170)">
    <rect x="0" y="0" width="270" height="220" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="135" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="64" font-weight="900" fill="#ea580c">$10</text>
    <text x="135" y="104" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="800" fill="#111827">到账额度</text>
    <text x="135" y="145" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">账户可用余额</text>
    <text x="135" y="174" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">支持多个模型</text>
  </g>

  <g transform="translate(740 170)">
    <rect x="0" y="0" width="270" height="220" rx="24" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
    <text x="135" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="64" font-weight="900" fill="#0891b2">~$50</text>
    <text x="135" y="104" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="800" fill="#111827">可用价值</text>
    <text x="135" y="145" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">模型倍率越低</text>
    <text x="135" y="174" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">余额越耐用</text>
  </g>

  <path d="M352 278h38" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M382 260l24 18-24 18" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M687 278h38" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M717 260l24 18-24 18" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="258" y="424" width="564" height="44" rx="22" fill="#111827"/>
  <text x="540" y="453" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">先付得少，再按低倍率用更久，API 成本一眼就懂</text>
</svg>
